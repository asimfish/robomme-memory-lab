<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9f6">
  <meta name="description" content="FDS × Franka 四类真机实验：同版本契约开关对照、证据与纠错、人工操作和结果记录。">
  <title>FDS × Franka · 真机实验方案</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=0.4.0">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="masthead">
    <a class="brand" href="#overview" aria-label="FDS Franka 研究方案首页">FDS <span>/</span> Franka</a>
    <nav class="site-nav" aria-label="网站导航">
      <a href="#overview" data-route="overview">研究方案</a>
      <a href="#results" data-route="results">实验记录</a>
      <details class="tools-menu"><summary>操作与维护</summary><div class="tools-menu-list">
        <a href="#method" data-route="method">方法实现依据</a>
        <a href="#tasks" data-route="tasks">任务操作卡</a>
        <a href="#coverage" data-route="coverage">完整覆盖矩阵</a>
        <a href="#protocol" data-route="protocol">评测协议</a>
        <a href="#maintain" data-route="maintain">数据维护与导出</a>
      </div></details>
    </nav>
  </header>
  <div class="workspace">
    <div class="topbar"><span id="page-name">研究方案</span><div class="top-actions"><span id="draft-indicator" class="draft-indicator">仓库版本</span><button type="button" class="text-button" data-action="export">导出数据 ↓</button></div></div>
    <main id="main" tabindex="-1"><div class="loading-state">正在加载实验方案…</div></main>
    <footer class="site-footer"><div><strong>FDS × Franka</strong><span id="sidebar-phase"></span></div><div><span id="version-label"></span><span id="updated-date"></span><a id="repository-link" href="#maintain">GitHub ↗</a></div></footer>
  </div>
  <dialog id="trial-dialog" aria-labelledby="trial-title">
    <div class="dialog-heading"><div><span class="eyebrow">EXPERIMENT LOG</span><h2 id="trial-title">记录一次执行</h2></div><button class="icon-button" type="button" data-action="close-dialog" aria-label="关闭记录窗口">×</button></div>
    <form id="trial-form"><div id="trial-fields"></div><div class="form-error" id="trial-error" role="alert"></div><div class="dialog-actions"><p>保存在本机草稿，导出后提交到仓库即可共享。</p><button type="submit" class="button primary">保存记录</button></div></form>
  </dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title">恢复仓库中的版本？</h2><p>当前浏览器的本机草稿会被清除。先导出数据可以保留这些修改。</p><div class="dialog-actions"><button class="button secondary" data-action="cancel-reset">保留草稿</button><button class="button primary" data-action="confirm-reset">恢复仓库版本</button></div></dialog>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js?v=0.4.0"></script>
</body>
</html>
